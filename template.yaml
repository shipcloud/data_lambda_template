AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: <Lambda Function Description> 

Globals:
  Function:
    Timeout: 10
    MemorySize: 128

Parameters:
  NotificationTopicArn:
    Type: String
    Default: "arn:aws:sns:eu-central-1:420422022241:LambdaAlertTopic"

Resources:
  LambdaExecRoles:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  
  DataTeamLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: data-team-layer
      ContentUri: data_team_layer/
      CompatibleRuntimes:
        - python3.10
        - python3.11
    Metadata:
      BuildMethod: makefile
  
  <Function name>: # The name should be in camel case. E.g., HelloWorldFunction
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: src/
      Runtime: python3.11
      FunctionName: lake-<Function name> # The name is used for invocation and it should be in kebab case. E.g., lake-hello-world
      Role:
        Fn::GetAtt:
        - LambdaExecRoles
        - ArN
      Layers:
        - !Ref DataTeamLayer
        
  <Function name>Alert: # The name should be in camel case. E.g., HelloWorldFunctionAlert
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref NotificationTopicArn
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref <Function name> # E.g., HelloWorldFunction
      EvaluationPeriods: 1
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 300
      Statistic: Sum
      Threshold: 0
      TreatMissingData: ignore
